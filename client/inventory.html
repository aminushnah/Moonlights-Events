<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inventory Management - Moon Light Events Admin</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet"/>
<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
body { font-family: 'Inter', sans-serif; }
a:hover, button:hover { filter: brightness(1.05); }
tr:hover { background-color: rgba(17,24,39,0.04); }
.dark tr:hover { background-color: rgba(148,163,184,0.08); }

/* Sticky Footer bottom-right */
footer {
    position: fixed;
    bottom: 0;
    right: 0;
    width: 100%;
    text-align: right;
    padding: 0.75rem 2rem;
    font-size: 0.75rem;
    color: #6B7280;
    background-color: #F3F4F6;
    border-top: 1px solid #D1D5DB;
    z-index: 50;
}
body.dark footer {
    color: #9CA3AF;
    background-color: #0F172A;
    border-top: 1px solid #1F2937;
}

/* Search Box */
.search-box {
    flex: 1;
    display: flex;
    align-items: center;
    background-color: #E5E7EB; /* gray-100 */
    padding: 0.5rem 1.5rem;
    border-radius: 9999px; /* full round */
    transition: background-color 0.3s;
}
.search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    text-align: center;
    font-size: 0.875rem;
    color: #111827;
    padding: 0.5rem 0;
}
.search-box:hover {
    background-color: #D1D5DB;
}
body.dark .search-box {
    background-color: #1F2937;
}
body.dark .search-box:hover {
    background-color: #374151;
}
body.dark .search-box input {
    color: #FFFFFF;
}
</style>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        primary: "#111827",          /* Black main */
        secondary: "#6B7280",        /* Gray text */
        accent: "#9CA3AF",           /* Light Gray / hover */
        "background-light": "#F3F4F6",
        "background-dark": "#0F172A",
        "card-dark": "#1E293B",
      },
      fontFamily: { display: ["Inter"] }
    }
  }
}
</script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-primary dark:text-white">
<div class="flex h-screen overflow-hidden">

<!-- Sidebar -->
<aside class="w-64 border-r border-gray-300 dark:border-gray-800 bg-white dark:bg-card-dark flex flex-col">
  <div class="p-6">
    <div class="flex items-center gap-3">
      <img src="./images/logo.jpg" alt="Moon Light Events Logo" class="w-10 h-10 object-contain"/>
      <div>
        <h1 class="text-primary dark:text-white text-base font-bold leading-tight">Moon Light Events</h1>
        <p class="text-secondary text-xs font-normal">Rental Management</p>
      </div>
    </div>
  </div>

  <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
    <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-secondary hover:bg-accent dark:hover:bg-gray-800 transition-colors" href="./dashbord.html">
      <span class="material-symbols-outlined">dashboard</span>
      <span class="text-sm font-medium">Dashboard</span>
    </a>
    <a class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/10 text-primary" href="inventory.html">
      <span class="material-symbols-outlined">package_2</span>
      <span class="text-sm font-medium">Inventory</span>
    </a>
    <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-secondary hover:bg-accent dark:hover:bg-gray-800 transition-colors" href="bookings.html">
      <span class="material-symbols-outlined">calendar_today</span>
      <span class="text-sm font-medium">Bookings</span>
    </a>
    <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-secondary hover:bg-accent dark:hover:bg-gray-800 transition-colors" href="clients.html">
      <span class="material-symbols-outlined">group</span>
      <span class="text-sm font-medium">Clients</span>
    </a>
    <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-secondary hover:bg-accent dark:hover:bg-gray-800 transition-colors" href="settings.html">
      <span class="material-symbols-outlined">settings</span>
      <span class="text-sm font-medium">Settings</span>
    </a>
  </nav>

  <div class="p-4 border-t border-border-light dark:border-border-dark">
    <button onclick="document.documentElement.classList.toggle('dark')"
      class="w-full flex items-center gap-3 p-3 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-neutral-800 transition">
      <span class="material-icons-outlined">dark_mode</span>
      Toggle Theme
    </button>
  </div>
</aside>

<!-- Main Content -->
<main class="flex-1 flex flex-col overflow-hidden">

<!-- Page Header -->
<header class="bg-white dark:bg-card-dark border-b border-gray-300 dark:border-gray-800 px-8 py-6 flex items-center justify-between sticky top-0 z-10">
  <h2 class="text-primary dark:text-white text-3xl font-black tracking-tight">Inventory Management</h2>

  <!-- Circular Search Box -->
  <div class="search-box w-96 ml-4">
    <span class="material-symbols-outlined text-gray-400 mr-3">search</span>
    <input type="text" placeholder="Search Inventory..." />
  </div>

  <button class="flex items-center justify-center rounded-lg bg-primary px-5 h-10 text-white text-sm font-bold gap-2 hover:bg-gray-900 transition-all ml-4">
    <span class="material-symbols-outlined text-sm">add</span>
    <span>Add New Item</span>
  </button>
</header>

<!-- Rest of your page content -->
<div class="flex-1 overflow-y-auto p-8">
  <!-- Your filters, table, stats, pagination etc. go here -->
</div>

<!-- Sticky Footer -->
<footer>
© 2026 Moon Light Events. All rights reserved.
</footer>


</body>
</html>
