<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <img src="./images/logo.jpg" alt="Moon Light Events Logo" class="logo">

    <h2>User Login</h2>

    <form onsubmit="loginUser(event)">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p>
        <a href="forgot-password.html">Forgot Password?</a>
    </p>
</div>

<script>
    function loginUser(event) {
        event.preventDefault(); // form reload rokne ke liye

        // demo credentials (example)
        const correctEmail = "user@gmail.com";
        const correctPassword = "123456";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (email === correctEmail && password === correctPassword) {
            window.location.href = "./dashbord.html"; // redirect
        } else {
            alert("Invalid Email or Password");
        }
    }
</script>

</body>
</html>
