<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orders & Rentals – Event Rentals Pro</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#0F172A",        /* Black */
            secondary: "#6B7280",      /* Gray */
            backgroundLight: "#F8FAFC",
            backgroundDark: "#020617",
            borderLight: "#CBD5E1",
          },
          fontFamily: {
            display: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>

<body class="bg-backgroundLight dark:bg-backgroundDark min-h-screen">

<!-- SIDEBAR -->
<aside class="fixed w-64 h-full bg-white dark:bg-backgroundDark border-r border-borderLight p-4">
  
  
   <!-- Logo updated -->
      <img src="./images/logo.jpg" alt="Moon Light Events Logo" class="w-10 h-10 object-contain"/>
      <div>
        <h1 class="text-primary dark:text-white text-base font-bold leading-tight">Moon Light Events</h1>
        <p class="text-secondary text-xs font-normal">Rental Management</p>
      </div>
    </div>
  </div>
  <!-- Menu -->
  <nav class="space-y-2">
    <a href="./dashbord.html" class="block p-3 rounded-lg bg-gray-100 text-primary font-semibold">Dashboard</a>
    <a href="./inventory.html" class="block p-3 rounded-lg text-secondary hover:bg-gray-100 hover:text-primary">Inventory</a>
    <a href="./Quotations.html" class="block p-3 rounded-lg text-secondary hover:bg-gray-100 hover:text-primary">Orders & Rentals</a>
    <a href="./orders.html" class="block p-3 rounded-lg text-secondary hover:bg-gray-100 hover:text-primary">Invoices</a>
  </nav>

  <!-- Theme Toggle -->
 
  <div class="p-4 border-t border-border-light dark:border-border-dark">
    <button onclick="document.documentElement.classList.toggle('dark')"
      class="w-full flex items-center gap-3 p-3 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-neutral-800 transition">
      <span class="material-icons-outlined">dark_mode</span>
      Toggle Theme
    </button>
  </div>
</aside>

<!-- MAIN -->
<div class="ml-64 p-8">

  <!-- Header -->
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-black text-primary">Orders & Rentals</h1>
    <button class="bg-primary text-white px-5 py-2 rounded-lg hover:bg-black/90">
      + New Order
    </button>
  </div>

  <!-- Search -->
  <div class="bg-white dark:bg-gray-900 p-4 rounded-xl border border-borderLight mb-6">
    <input
      type="text"
      placeholder="Search orders..."
      class="w-full border border-borderLight rounded-lg px-4 py-2"
    />
  </div>

  <!-- Table -->
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-borderLight overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-100 text-secondary">
        <tr>
          <th class="p-4 text-left">Order ID</th>
          <th class="p-4 text-left">Client</th>
          <th class="p-4 text-left">Event</th>
          <th class="p-4 text-left">Status</th>
          <th class="p-4 text-left">Payment</th>
        </tr>
      </thead>
      <tbody class="divide-y">
        <tr class="hover:bg-gray-50">
          <td class="p-4 font-bold text-primary">#ORD-8821</td>
          <td class="p-4">Jane Doe</td>
          <td class="p-4">Wedding</td>
          <td class="p-4 text-green-600 font-semibold">Delivered</td>
          <td class="p-4 text-primary font-semibold">Paid</td>
        </tr>
        <tr class="hover:bg-gray-50">
          <td class="p-4 font-bold text-primary">#ORD-8822</td>
          <td class="p-4">John Smith</td>
          <td class="p-4">Corporate</td>
          <td class="p-4 text-orange-600 font-semibold">Shipped</td>
          <td class="p-4 text-secondary">Partial</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-8">
    <div class="p-5 bg-white rounded-xl border border-borderLight">
      <p class="text-secondary text-xs font-bold uppercase">Total Rentals</p>
      <p class="text-2xl font-black text-primary">128</p>
    </div>
    <div class="p-5 bg-white rounded-xl border border-borderLight">
      <p class="text-secondary text-xs font-bold uppercase">Active</p>
      <p class="text-2xl font-black text-primary">42</p>
    </div>
    <div class="p-5 bg-white rounded-xl border border-borderLight">
      <p class="text-secondary text-xs font-bold uppercase">Revenue</p>
      <p class="text-2xl font-black text-primary">$24,400</p>
    </div>
    <div class="p-5 bg-white rounded-xl border border-borderLight">
      <p class="text-secondary text-xs font-bold uppercase">Pending</p>
      <p class="text-2xl font-black text-primary">15</p>
    </div>
  </div>

</div>

</body>
</html>
