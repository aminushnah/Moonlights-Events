<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quotations Management</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

<!-- Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300..700&display=swap" rel="stylesheet"/>

<!-- Tailwind Config -->
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        primary: "#111827",     /* Black */
        secondary: "#6B7280",   /* Gray */
        lightbg: "#F3F4F6",
        darkbg: "#0F172A",
        carddark: "#1E293B"
      },
      fontFamily: {
        display: ["Inter"]
      }
    }
  }
}
</script>

<style>
body { font-family: 'Inter', sans-serif; }
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
}
a:hover, button:hover { filter: brightness(1.05); }
tr:hover { background: rgba(17,24,39,0.04); }
.dark tr:hover { background: rgba(148,163,184,0.08); }
</style>
</head>

<body class="bg-lightbg text-primary dark:bg-darkbg dark:text-white">

<div class="flex min-h-screen">

<!-- ================= SIDEBAR ================= -->
<aside class="w-64 bg-white dark:bg-carddark border-r border-gray-200 dark:border-gray-700 flex flex-col">
  
  <!-- LOGO -->
  <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-200 dark:border-gray-700">
    <img src="./images/logo.jpg" alt="Logo" class="w-10 h-10 object-contain"/>
    <span class="text-lg font-bold">Moon Light Events</span>
  </div>

  <!-- MENU -->
  <nav class="flex-1 px-4 py-6 space-y-2 text-sm font-medium">
    <a class="flex items-center gap-3 px-4 py-3 rounded-lg bg-gray-200 dark:bg-gray-800 text-primary" href="./dashbord.html">
      <span class="material-symbols-outlined">dashboard</span>
      Dashboard
    </a>
    <a  href="./Quotations.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-secondary hover:bg-gray-200 dark:hover:bg-gray-800" >
      <span class="material-symbols-outlined">request_quote</span>
      Quotations
    </a>
    <a href="./inventory.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-secondary hover:bg-gray-200 dark:hover:bg-gray-800" >
      <span class="material-symbols-outlined">inventory</span>
      Inventory
    </a>
    <a  href="./orders.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-secondary hover:bg-gray-200 dark:hover:bg-gray-800"  >
      <span class="material-symbols-outlined">groups</span>
      Customers
    </a>
  </nav>
</aside>

<!-- ================= MAIN ================= -->
<div class="flex-1 flex flex-col">

<!-- HEADER -->
<header class="flex items-center justify-between px-8 py-4 bg-white dark:bg-carddark border-b border-gray-200 dark:border-gray-700">
  <h1 class="text-2xl font-black">Quotations</h1>
  <button class="flex items-center gap-2 px-5 py-2 bg-primary text-white rounded-lg font-bold">
    <span class="material-symbols-outlined">add</span>
    New Quote
  </button>
</header>

<!-- CONTENT -->
<main class="p-8">

<!-- STATS -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
  <div class="bg-white dark:bg-carddark p-5 rounded-xl border border-gray-200 dark:border-gray-700">
    <p class="text-secondary text-sm">Draft</p>
    <p class="text-3xl font-bold mt-2">12</p>
  </div>
  <div class="bg-white dark:bg-carddark p-5 rounded-xl border border-gray-200 dark:border-gray-700">
    <p class="text-secondary text-sm">Sent</p>
    <p class="text-3xl font-bold mt-2">28</p>
  </div>
  <div class="bg-white dark:bg-carddark p-5 rounded-xl border border-gray-200 dark:border-gray-700">
    <p class="text-secondary text-sm">Accepted</p>
    <p class="text-3xl font-bold mt-2">156</p>
  </div>
  <div class="bg-white dark:bg-carddark p-5 rounded-xl border border-gray-200 dark:border-gray-700">
    <p class="text-secondary text-sm">Expired</p>
    <p class="text-3xl font-bold mt-2">5</p>
  </div>
</div>

<!-- TABLE -->
<div class="bg-white dark:bg-carddark rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
<table class="w-full text-sm">
<thead class="bg-gray-100 dark:bg-gray-800">
<tr>
<th class="px-6 py-4 text-left text-secondary">Quote ID</th>
<th class="px-6 py-4 text-left text-secondary">Customer</th>
<th class="px-6 py-4 text-left text-secondary">Date</th>
<th class="px-6 py-4 text-left text-secondary">Amount</th>
<th class="px-6 py-4 text-left text-secondary">Status</th>
</tr>
</thead>
<tbody class="divide-y divide-gray-200 dark:divide-gray-700">
<tr>
<td class="px-6 py-4 font-bold">#QT-001</td>
<td class="px-6 py-4">Grand Plaza</td>
<td class="px-6 py-4 text-secondary">12 Oct 2024</td>
<td class="px-6 py-4 font-bold">$1,250</td>
<td class="px-6 py-4">
  <span class="px-3 py-1 rounded-full bg-gray-200 dark:bg-gray-700 text-xs font-bold">
    Accepted
  </span>
</td>
</tr>
</tbody>
</table>
</div>

</main>

<!-- FOOTER -->


</div>
</div>
<footer class="text-center text-xs text-secondary py-4">
© 2026 Moon Light Events. All rights reserved.
</footer>

</body>
</html>
